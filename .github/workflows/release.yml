name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Run Tests
        run: go test -v ./...

      - name: Create Distribution Directory
        run: mkdir -p dist

      - name: Build Windows AMD64 (val0.exe)
        env:
          CGO_ENABLED: "0"
          GOOS: "windows"
          GOARCH: "amd64"
        run: |
          go build -ldflags="-s -w" -trimpath -o dist/val0.exe .

      - name: Generate SHA-256 Checksums
        working-directory: dist
        run: |
          # Generate individual hash file for Windows binary
          sha256sum val0.exe > val0.exe.sha256

          # Generate master checksums file for release artifacts
          sha256sum val0.exe > checksums.txt

          echo "=== SHA-256 Checksums ==="
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/val0.exe
            dist/val0.exe.sha256
            dist/checksums.txt
