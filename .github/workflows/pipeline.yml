name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_bump:
        description: 'Force specific SemVer bump (leave blank for automatic)'
        required: false
        type: choice
        options:
          - ''
          - patch
          - minor
          - major
      dry_run:
        description: 'Dry run: compile without creating Git tags or draft releases'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write
  pull-requests: read

jobs:
  # =========================================================================
  # 1. QUALITY ASSURANCE: Linting & Unit Testing
  # =========================================================================
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Static Analysis (go vet)
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v -race ./...

  # =========================================================================
  # 2. SEMANTIC VERSIONING: Tag Calculation & Generation
  # =========================================================================
  tag:
    name: Determine & Apply SemVer
    needs: test
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      !contains(github.event.head_commit.message, '[skip release]') &&
      !inputs.dry_run
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.semver.outputs.new_tag }}
      new_version: ${{ steps.semver.outputs.new_version }}
      changelog: ${{ steps.semver.outputs.changelog }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate & Apply Tag
        id: semver
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: ${{ inputs.force_bump != '' && inputs.force_bump || 'patch' }}
          tag_prefix: 'v'
          release_branches: 'main'
          create_annotated_tag: true
          custom_release_rules: |
            breaking:major:Breaking Changes,
            break:major:Breaking Changes,
            major:major:Breaking Changes,
            feat:minor:Features,
            feature:minor:Features,
            minor:minor:Features,
            add:minor:Features,
            perf:minor:Performance Improvements,
            fix:patch:Bug Fixes,
            bugfix:patch:Bug Fixes,
            bug:patch:Bug Fixes,
            hotfix:patch:Bug Fixes,
            patch:patch:Bug Fixes,
            refactor:patch:Refactoring & Polish,
            style:patch:UI & Style Improvements,
            align:patch:UI & Style Improvements,
            docs:patch:Documentation,
            chore:patch:Maintenance

  # =========================================================================
  # 3. BUILD & DISTRIBUTION: Cross-Compile, Checksum & Release
  # =========================================================================
  build:
    name: Build & Package Binary
    needs: [test, tag]
    if: |
      always() &&
      (needs.test.result == 'success') &&
      (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache: true

      - name: Determine Version Context
        id: version_context
        shell: bash
        run: |
          if [ "${{ needs.tag.outputs.new_tag }}" != "" ]; then
            TAG="${{ needs.tag.outputs.new_tag }}"
            IS_RELEASE=true
          else
            TAG="dev-${{ github.sha }}"
            IS_RELEASE=false
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "is_release=${IS_RELEASE}" >> $GITHUB_OUTPUT

      - name: Cross-Compile Windows Binary (val0.exe)
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: 'windows'
          GOARCH: 'amd64'
        run: |
          VERSION="${{ steps.version_context.outputs.tag }}"
          COMMIT="${{ github.sha }}"
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          LDFLAGS="-s -w -X 'main.Version=${VERSION}' -X 'main.Commit=${COMMIT}' -X 'main.BuildDate=${BUILD_DATE}'"
          
          mkdir -p dist
          go build -trimpath -ldflags="${LDFLAGS}" -o dist/val0.exe .

      - name: Generate SHA256 Checksum
        shell: bash
        run: |
          cd dist
          sha256sum val0.exe > val0.exe.sha256
          cat val0.exe.sha256

      - name: Upload Ephemeral Artifact (PR & Non-Release Builds)
        if: steps.version_context.outputs.is_release == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: val0-windows-amd64-${{ github.sha }}
          path: |
            dist/val0.exe
            dist/val0.exe.sha256
          retention-days: 7

      - name: Create Draft GitHub Release
        if: steps.version_context.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.new_tag }}
          name: Release ${{ needs.tag.outputs.new_tag }}
          body: |
            ${{ needs.tag.outputs.changelog }}

            ---
            ### Verification
            Verify the integrity of `val0.exe` using SHA256:
            ```
            $(cat dist/val0.exe.sha256)
            ```
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            dist/val0.exe
            dist/val0.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
